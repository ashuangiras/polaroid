# golangci-lint v2 configuration. The pinned version lives in the Makefile
# (GOLANGCI_LINT_VERSION) and .github/workflows/ci.yml; keep them equal.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose     # HTTP response bodies are closed
    - errorlint     # errors are compared with errors.Is/As
    - gosec         # common security mistakes
    - misspell
    - noctx         # network calls carry a context
    - rowserrcheck  # sql.Rows.Err is checked
    - sqlclosecheck # sql.Rows and statements are closed
  settings:
    errcheck:
      # Diagnostics written to stdout/stderr have no meaningful recovery.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Tests deliberately read fixture files and run `go list`.
      - path: _test\.go
        linters:
          - gosec
