# Builds the lightweight, local-equivalent verification artifact (ADR-0041)
# for one commit and hands it off as a workflow-run artifact: a real,
# downloadable URL, with no GitHub Release, tag or deployment. A second job
# retrieves it exactly as an independent consumer would -- a separate runner,
# nothing carried over from the build -- and validates it: checksums against
# the manifest, each binary's embedded Go build info, and a smoke test.
# Manual dispatch only; never runs on push or pull_request (ADR-0031: hosted
# CI is local-only policy here, and this never gates anything).
# Actions are pinned; see docs/development/dependencies.md.
name: artifact

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Space-separated OS/ARCH targets (passed to `make artifact`)
        required: false
        default: linux/amd64

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: make artifact
        run: make artifact ARTIFACT_TARGETS="${{ inputs.targets }}"

      - name: Hand off the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polaroid-verification-artifact-${{ steps.commit.outputs.sha }}
          path: dist/artifacts/${{ steps.commit.outputs.sha }}
          if-no-files-found: error
          retention-days: 14

  verify:
    name: verify (independent consumer)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve the handed-off artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: polaroid-verification-artifact-${{ needs.build.outputs.commit }}
          path: artifact

      - name: Set up Go (to read embedded build info, not to build anything)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate every checksum the manifest lists
        run: |
          set -euo pipefail
          cd artifact
          jq -r '.assets[].files[] | .path + " " + .sha256' manifest.json | while read -r path sum; do
            echo "$sum  $path" | sha256sum -c -
          done

      - name: Inspect each binary's embedded Go build info
        run: |
          set -euo pipefail
          cd artifact
          commit=$(jq -r .commit manifest.json)
          for f in */polaroidd */polaroid; do
            chmod +x "$f"
            info=$(go version -m "$f")
            echo "$info" | grep -q "vcs.revision=$commit" || { echo "::error::$f: vcs.revision is not $commit"; exit 1; }
            echo "$info" | grep -q "vcs.modified=false" || { echo "::error::$f: built from a modified tree"; exit 1; }
          done

      - name: Smoke test
        run: |
          set -euo pipefail
          cd artifact/linux_amd64
          ./polaroidd -version
          ./polaroid version
