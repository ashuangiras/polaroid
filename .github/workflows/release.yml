# Packages a release from a tag on main, tests the archives themselves on
# native runners, in a container without systemd and as a systemd user
# service, publishes them, then downloads the published assets and tests them
# again (ADR-0028). A tag vX.Y.Z is a stable release, marked latest; a tag
# vX.Y.Z-label is a prerelease, never marked latest (ADR-0038). It never
# replaces an existing release.
# Dispatched by hand without a tag, it is a dry run of the selected branch:
# it packages it with a local-only tag v0.0.0-dispatch.N and runs every
# archive test, but publishes nothing. Pull requests no longer start it
# (ADR-0031).
# Actions and images are pinned; see docs/development/dependencies.md.
name: release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag on main to publish, for example v1.0.0 or v1.0.0-rc.1. Leave empty for a dry run of the selected branch, which publishes nothing.
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag == '') && format('v0.0.0-dispatch.{0}', github.run_number) || inputs.tag || github.ref_name }}

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the tag (or, for a dry run, the selected branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'push' || inputs.tag != '') && format('refs/tags/{0}', env.TAG) || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check that the tag is an unpublished release version on main
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$TAG is not a release version (vX.Y.Z or vX.Y.Z-label)"; exit 1; }
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main || { echo "::error::$TAG ($commit) is not on main"; exit 1; }
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; a published version is never replaced"; exit 1
          fi
          git tag -l --format='%(contents)' "$TAG" >"$RUNNER_TEMP/tag-message.md"

      - name: Tag the selected branch locally (never pushed)
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        run: |
          git -c user.name=release-dry-run -c user.email=release-dry-run@example.invalid tag -a "$TAG" -m "Dry run of $GITHUB_REF_NAME at $GITHUB_SHA; not published."
          git tag -l --format='%(contents)' "$TAG" >"$RUNNER_TEMP/tag-message.md"

      - name: Build and package, and write the release notes
        run: |
          scripts/package.sh "$TAG" dist
          scripts/release-notes.sh dist/build-manifest.json "$RUNNER_TEMP/tag-message.md" >release-notes.md
          mkdir release-tests && cp scripts/smoke-archive-check.sh release-tests/
          cat dist/SHA256SUMS dist/build-manifest.json release-notes.md

      - name: Keep the assets for the test and publish jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/
            release-notes.md
            release-tests/
          if-no-files-found: error
          retention-days: 30

  test-archive:
    # Tests the archive, not the build directory: checksum, extraction,
    # versions and smoke-test.sh, with no checkout, no Go on PATH and an
    # empty HOME, on a runner of the archive's own OS and architecture.
    name: test ${{ matrix.os }}/${{ matrix.arch }} archive (native, ${{ matrix.runner }})
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-latest, machine: x86_64 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, machine: aarch64 }
          - { os: darwin, arch: amd64, runner: macos-15-intel, machine: x86_64 }
          - { os: darwin, arch: arm64, runner: macos-latest, machine: arm64 }
    env:
      OS: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
      MACHINE: ${{ matrix.machine }}
    steps:
      - name: Download the packaged assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: staged

      - name: Verify, extract and smoke-test the archive
        run: |
          set -euo pipefail
          [[ $(uname -m) == "$MACHINE" ]] || { echo "::error::runner is $(uname -m), not $MACHINE: not a native test"; exit 1; }
          cd staged/dist
          if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
          commit=$(jq -r .source.commit build-manifest.json)
          name="polaroid_${TAG}_${OS}_${ARCH}"
          review="$RUNNER_TEMP/review" home="$RUNNER_TEMP/empty home"
          mkdir -p "$review" "$home"
          tar -xzf "$name.tar.gz" -C "$review"
          cd "$review/$name"
          # PATH holds exactly the smoke test's documented dependencies.
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          for t in sh curl mktemp mkdir rm ls cat sed grep head sleep dirname; do ln -s "$(command -v "$t")" "$tools/$t"; done
          run() { env -i PATH="$tools" HOME="$home" TMPDIR="$RUNNER_TEMP" "$@"; }
          ! run sh -c 'command -v go' || { echo "::error::go is on the test PATH"; exit 1; }
          for v in "$(run ./polaroid version)" "$(run ./polaroidd -version)"; do
            echo "$v"
            [[ $(jq -r .revision <<<"$v") == "$commit" && $(jq -r .version <<<"$v") == "$TAG" && $(jq -r .modified <<<"$v") == false ]] ||
              { echo "::error::the binary does not report $TAG at $commit"; exit 1; }
          done
          run ./smoke-test.sh
          [[ -z $(ls -A "$home") ]] || { echo "::error::the smoke test wrote to HOME"; exit 1; }
          echo "ARCHIVE_DIR=$review/$name" >>"$GITHUB_ENV"

      - name: Smoke-test the archive under the platform's normal TMPDIR and a path with spaces, and its cleanup after failures (#52)
        run: bash staged/release-tests/smoke-archive-check.sh "$ARCHIVE_DIR"

  test-without-systemd:
    name: test linux/amd64 archive in a container without systemd (Alpine)
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download the packaged assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: staged

      - name: Verify, extract and smoke-test in Alpine; managed install must report unavailable
        run: |
          set -euo pipefail
          (cd staged/dist && sha256sum -c SHA256SUMS)
          docker run --rm -e TAG -v "$PWD/staged/dist:/dist:ro" alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 sh -euc '
            apk add --no-cache curl >/dev/null
            ! command -v systemctl
            ! command -v go
            mkdir -p /review && cd /review
            (cd /dist && sha256sum -c SHA256SUMS)
            tar -xzf "/dist/polaroid_${TAG}_linux_amd64.tar.gz"
            cd "polaroid_${TAG}_linux_amd64"
            ./polaroid version && ./polaroidd -version
            ./smoke-test.sh
            mkdir -p /tmp/h
            if HOME=/tmp/h ./polaroid install -from . >/tmp/install.json 2>/tmp/install.err; then
              echo "install succeeded without a service manager"; exit 1
            fi
            cat /tmp/install.err
            grep -q "service manager unavailable" /tmp/install.err
            echo "managed-service testing: unavailable here (no systemd), as reported"
          '

  test-managed-service:
    # Installs the linux/amd64 archive as a real systemd user service, isolated
    # by HOME, service name and port, and operates it as a user would.
    # Lingering is enabled for the runner's user in this disposable VM only, so
    # that a user manager runs without a login; polaroid install never enables it.
    name: test linux/amd64 archive as a systemd user service
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download the packaged assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: staged

      - name: Start a systemd user manager for the runner's user
        run: |
          sudo loginctl enable-linger "$USER"
          runtime="/run/user/$(id -u)"
          for _ in $(seq 1 30); do [ -S "$runtime/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$runtime" systemctl --user show-environment >/dev/null

      - name: Install, operate, back up and uninstall the archive as a managed service
        run: |
          set -euo pipefail
          cd staged/dist
          sha256sum -c SHA256SUMS
          commit=$(jq -r .source.commit build-manifest.json)
          name="polaroid_${TAG}_linux_amd64"
          review="$RUNNER_TEMP/review" H="$RUNNER_TEMP/managed-home"
          mkdir -p "$review" "$H"
          tar -xzf "$name.tar.gz" -C "$review"
          cd "$review/$name"
          url=http://127.0.0.1:27417
          step() { echo "== $*"; }
          step install
          HOME=$H ./polaroid install -from . -addr 127.0.0.1:27417 -service-name polaroid-release-test
          P="$H/.local/bin/polaroid"
          state() { HOME=$H "$P" status 2>/dev/null | jq -r .state; }
          HOME=$H "$P" status | jq -e --arg tag "$TAG" --arg c "$commit" '.state == "running" and .manager == "systemd" and .build.version == $tag and .build.revision == $c'
          curl -sf "$url/healthz"
          step write and read through the managed service
          printf '%s' '{"canonical_key":"release.managed","version":{"philosophy":"p","method":"m","contract":{},"instructions":{"steps":["one"]},"revision_reason":"Initial version."}}' |
            HOME=$H "$P" -server "$url" create >/dev/null
          before=$(HOME=$H "$P" -server "$url" get-by-key release.managed)
          step restart
          pid=$(HOME=$H "$P" status | jq .pid)
          HOME=$H "$P" restart
          [[ $(state) == running && $(HOME=$H "$P" status | jq .pid) != "$pid" ]]
          [[ $(HOME=$H "$P" -server "$url" get-by-key release.managed) == "$before" ]]
          step back up the running managed catalog, inspect, plan a restore
          backup=$(HOME=$H "$P" backup | jq -r .path)
          HOME=$H "$P" inspect-backup "$backup" | jq -e '.valid and .schema_version >= 10'
          HOME=$H "$P" restore -plan "$backup" >/dev/null
          step stop and start
          HOME=$H "$P" stop
          rc=0; HOME=$H "$P" status >/dev/null || rc=$?; [[ $rc == 3 ]]
          if curl -sf "$url/healthz" >/dev/null; then echo "::error::the stopped service still answers"; exit 1; fi
          HOME=$H "$P" start
          [[ $(state) == running && $(HOME=$H "$P" -server "$url" get-by-key release.managed) == "$before" ]]
          step uninstall keeps the catalog
          HOME=$H "$P" uninstall
          rc=0; HOME=$H ./polaroid status >/dev/null || rc=$?; [[ $rc == 4 ]]
          [[ -f "$H/.polaroid/data/polaroid.db" && -d "$backup" ]]
          if curl -sf "$url/healthz" >/dev/null; then echo "::error::the uninstalled service still answers"; exit 1; fi
          echo "managed service: install, status, restart, backup, inspect-backup, restore -plan, stop, start, uninstall passed"

  publish:
    name: publish the release
    if: github.event_name == 'push' || inputs.tag != ''
    needs: [package, test-archive, test-without-systemd, test-managed-service]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the tested assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: staged

      - name: Publish (never replaces an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; a published version is never replaced"; exit 1
          fi
          if [[ $(jq -r .prerelease staged/dist/build-manifest.json) == true ]]; then
            kind=(--prerelease --latest=false --title "Polaroid $TAG (prerelease)")
          else
            kind=(--latest --title "Polaroid $TAG")
          fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag "${kind[@]}" --notes-file staged/release-notes.md \
            staged/dist/*.tar.gz staged/dist/SHA256SUMS staged/dist/build-manifest.json

  test-published:
    name: test the published assets
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download the tested assets for comparison
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: staged

      - name: Download the published assets, compare, verify and smoke-test linux/amd64
        run: |
          set -euo pipefail
          mkdir published && cd published
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          for f in $(cd ../staged/dist && ls); do
            curl -fsSL --retry 5 -o "$f" "$base/$f"
            cmp "$f" "../staged/dist/$f"
          done
          sha256sum -c SHA256SUMS
          home="$RUNNER_TEMP/empty home"
          mkdir -p "$home"
          tar -xzf "polaroid_${TAG}_linux_amd64.tar.gz"
          cd "polaroid_${TAG}_linux_amd64"
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          for t in sh curl mktemp mkdir rm ls cat sed grep head sleep dirname; do ln -s "$(command -v "$t")" "$tools/$t"; done
          env -i PATH="$tools" HOME="$home" TMPDIR="$RUNNER_TEMP" ./smoke-test.sh
          bash ../../staged/release-tests/smoke-archive-check.sh .
