# Packages a prerelease verification build from a tag on main, tests the
# archives themselves on native runners and in a container without systemd,
# publishes them as a GitHub prerelease, then downloads the published assets
# and tests them again (ADR-0028). It never replaces an existing release. On
# a pull request that changes packaging, it packages the PR with a local-only
# tag v0.0.0-pr.N and runs every archive test, but publishes nothing.
# Actions and images are pinned; see docs/development/dependencies.md.
name: release

on:
  push:
    tags: ["v*-*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package.sh
      - packaging/**
      - internal/version/**
  workflow_dispatch:
    inputs:
      tag:
        description: An existing prerelease tag on main, for example v0.1.0-verify.1
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'pull_request' && format('v0.0.0-pr.{0}', github.event.pull_request.number) || inputs.tag || github.ref_name }}

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the tag (or, for a pull request, its merge commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name != 'pull_request' && format('refs/tags/{0}', env.TAG) || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check that the tag is an unpublished prerelease on main
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]] || { echo "::error::$TAG is not a prerelease version (vX.Y.Z-label)"; exit 1; }
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main || { echo "::error::$TAG ($commit) is not on main"; exit 1; }
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; a published version is never replaced"; exit 1
          fi
          git tag -l --format='%(contents)' "$TAG" >"$RUNNER_TEMP/tag-message.md"

      - name: Tag the pull request locally (never pushed)
        if: github.event_name == 'pull_request'
        run: |
          git -c user.name=release-dry-run -c user.email=release-dry-run@example.invalid tag -a "$TAG" -m "Dry run for pull request ${{ github.event.pull_request.number }}; not published."
          git tag -l --format='%(contents)' "$TAG" >"$RUNNER_TEMP/tag-message.md"

      - name: Build and package
        run: |
          scripts/package.sh "$TAG" dist
          cp "$RUNNER_TEMP/tag-message.md" dist-notes.md
          cat dist/SHA256SUMS dist/build-manifest.json

      - name: Keep the assets for the test and publish jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/
            dist-notes.md
          if-no-files-found: error
          retention-days: 30

  test-archive:
    # Tests the archive, not the build directory: checksum, extraction,
    # versions and smoke-test.sh, with no checkout, no Go on PATH and an
    # empty HOME, on a runner of the archive's own OS and architecture.
    name: test ${{ matrix.os }}/${{ matrix.arch }} archive (native, ${{ matrix.runner }})
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-latest, machine: x86_64 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, machine: aarch64 }
          - { os: darwin, arch: amd64, runner: macos-15-intel, machine: x86_64 }
          - { os: darwin, arch: arm64, runner: macos-latest, machine: arm64 }
    env:
      OS: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
      MACHINE: ${{ matrix.machine }}
    steps:
      - name: Download the packaged assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: staged

      - name: Verify, extract and smoke-test the archive
        run: |
          set -euo pipefail
          [[ $(uname -m) == "$MACHINE" ]] || { echo "::error::runner is $(uname -m), not $MACHINE: not a native test"; exit 1; }
          cd staged/dist
          if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
          commit=$(jq -r .source.commit build-manifest.json)
          name="polaroid_${TAG}_${OS}_${ARCH}"
          review="$RUNNER_TEMP/review" home="$RUNNER_TEMP/empty home"
          mkdir -p "$review" "$home"
          tar -xzf "$name.tar.gz" -C "$review"
          cd "$review/$name"
          run() { env -i PATH=/usr/bin:/bin HOME="$home" TMPDIR="$RUNNER_TEMP" "$@"; }
          ! run sh -c 'command -v go' || { echo "::error::go is on the test PATH"; exit 1; }
          for v in "$(run ./polaroid version)" "$(run ./polaroidd -version)"; do
            echo "$v"
            [[ $(jq -r .revision <<<"$v") == "$commit" && $(jq -r .version <<<"$v") == "$TAG" && $(jq -r .modified <<<"$v") == false ]] ||
              { echo "::error::the binary does not report $TAG at $commit"; exit 1; }
          done
          run ./smoke-test.sh
          [[ -z $(ls -A "$home") ]] || { echo "::error::the smoke test wrote to HOME"; exit 1; }

  test-without-systemd:
    name: test linux/amd64 archive in a container without systemd (Alpine)
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download the packaged assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: staged

      - name: Verify, extract and smoke-test in Alpine; managed install must report unavailable
        run: |
          set -euo pipefail
          (cd staged/dist && sha256sum -c SHA256SUMS)
          docker run --rm -e TAG -v "$PWD/staged/dist:/dist:ro" alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 sh -euc '
            apk add --no-cache curl >/dev/null
            ! command -v systemctl
            ! command -v go
            mkdir -p /review && cd /review
            (cd /dist && sha256sum -c SHA256SUMS)
            tar -xzf "/dist/polaroid_${TAG}_linux_amd64.tar.gz"
            cd "polaroid_${TAG}_linux_amd64"
            ./polaroid version && ./polaroidd -version
            ./smoke-test.sh
            mkdir -p /tmp/h
            if HOME=/tmp/h ./polaroid install -from . >/tmp/install.json 2>/tmp/install.err; then
              echo "install succeeded without a service manager"; exit 1
            fi
            cat /tmp/install.err
            grep -q "service manager unavailable" /tmp/install.err
            echo "managed-service testing: unavailable here (no systemd), as reported"
          '

  publish:
    name: publish the prerelease
    if: github.event_name != 'pull_request'
    needs: [package, test-archive, test-without-systemd]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the tested assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: staged

      - name: Write the release notes
        run: |
          set -euo pipefail
          m=staged/dist/build-manifest.json
          commit=$(jq -r .source.commit "$m") go=$(jq -r .build.go "$m")
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "**Verification prerelease, not a stable production release.** It lets an independent reviewer download and test the exact build of one source commit. Binaries are unsigned and not notarized."
            echo
            echo "- **Source commit:** [\`$commit\`](https://github.com/$GITHUB_REPOSITORY/tree/$commit) (tag \`$TAG\`)"
            echo "- **Packaging run:** $run_url (\`.github/workflows/release.yml\`)"
            echo "- **Toolchain:** $go, \`CGO_ENABLED=0\`, \`-trimpath\`; both binaries report \`version\` $TAG and \`revision\` $commit"
            echo
            if [[ -s staged/dist-notes.md ]]; then cat staged/dist-notes.md; echo; fi
            echo "## Assets"
            echo
            echo "| Platform | Archive | Tested in the packaging run |"
            echo "| --- | --- | --- |"
            echo "| linux/amd64 | \`polaroid_${TAG}_linux_amd64.tar.gz\` | Natively on ubuntu-latest, and in an Alpine container without systemd |"
            echo "| linux/arm64 | \`polaroid_${TAG}_linux_arm64.tar.gz\` | Natively on ubuntu-24.04-arm |"
            echo "| darwin/amd64 | \`polaroid_${TAG}_darwin_amd64.tar.gz\` | Natively on macos-15-intel |"
            echo "| darwin/arm64 | \`polaroid_${TAG}_darwin_arm64.tar.gz\` | Natively on macos-latest (arm64) |"
            echo
            echo "Each test verified \`SHA256SUMS\`, extracted the archive, checked both binaries' reported version and commit, and ran the archive's \`smoke-test.sh\` with no checkout, no Go and an empty \`HOME\`. After publishing, the same run downloads the published assets, compares them with the tested ones and repeats the linux/amd64 test (job \"test the published assets\")."
            echo
            echo "\`SHA256SUMS\` covers every archive. \`build-manifest.json\` gives the full commit, version, Go toolchain, targets and per-asset hashes."
            echo
            echo "## Quick start (Linux amd64)"
            echo
            echo '```sh'
            echo "base=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
            echo "curl -fsSLO \"\$base/polaroid_${TAG}_linux_amd64.tar.gz\" -O \"\$base/SHA256SUMS\""
            echo "sha256sum -c --ignore-missing SHA256SUMS"
            echo "tar -xzf polaroid_${TAG}_linux_amd64.tar.gz && cd polaroid_${TAG}_linux_amd64"
            echo "./polaroid version && ./polaroidd -version && ./smoke-test.sh"
            echo '```'
            echo
            echo "## Known limitations"
            echo
            echo "- Prerelease for verification: no compatibility promises, unsigned, not notarized. On macOS, a browser download may need \`xattr -d com.apple.quarantine polaroid polaroidd\`."
            echo "- The smoke test runs \`polaroidd\` directly. It does not test the managed service (\`polaroid install\`, launchd, systemd); the archive's README.md describes that separate test, and the repository tests it with \`make lifecycle\`."
            echo "- The managed service supports macOS (launchd) and Linux (systemd user services) only; elsewhere, run \`polaroidd\` directly."
            echo "- The API and MCP server have no authentication and are meant for loopback use."
          } >notes.md
          cat notes.md

      - name: Publish (never replaces an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; a published version is never replaced"; exit 1
          fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "Polaroid $TAG (verification prerelease)" --notes-file notes.md \
            staged/dist/*.tar.gz staged/dist/SHA256SUMS staged/dist/build-manifest.json

  test-published:
    name: test the published assets
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download the tested assets for comparison
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: staged

      - name: Download the published assets, compare, verify and smoke-test linux/amd64
        run: |
          set -euo pipefail
          mkdir published && cd published
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          for f in $(cd ../staged/dist && ls); do
            curl -fsSL --retry 5 -o "$f" "$base/$f"
            cmp "$f" "../staged/dist/$f"
          done
          sha256sum -c SHA256SUMS
          home="$RUNNER_TEMP/empty home"
          mkdir -p "$home"
          tar -xzf "polaroid_${TAG}_linux_amd64.tar.gz"
          cd "polaroid_${TAG}_linux_amd64"
          env -i PATH=/usr/bin:/bin HOME="$home" TMPDIR="$RUNNER_TEMP" ./smoke-test.sh
