name: Work item
description: A scoped change with testable acceptance criteria.
body:
  - type: markdown
    attributes:
      value: |
        One item per pull request. Rules: `AGENTS.md`. Process: `docs/development/workflow.md`.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or wrong, and for whom.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this item includes, and what it explicitly excludes.
    validations:
      required: true
  - type: textarea
    id: contract-impact
    attributes:
      label: Contract impact
      description: Changes to the HTTP API, record contracts, database schema or CLI, with their compatibility consequences. Write "None" if there are none.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Work items or decisions that must land first.
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Numbered, observable, testable statements.
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: The tests and commands that will demonstrate each criterion, for example `make check` and `make demo`.
    validations:
      required: true
